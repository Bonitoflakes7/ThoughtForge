services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thoughtforge
      POSTGRES_USER: thoughtforge
      POSTGRES_PASSWORD: thoughtforge_dev
    ports:
      - "5432:5432"
    volumes:
      - thoughtforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thoughtforge -d thoughtforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - thoughtforge-redis:/data

volumes:
  thoughtforge-postgres:
  thoughtforge-redis:
